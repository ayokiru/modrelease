[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modrelease"
version = "0.1.0"
description = "Get a game mod ready for release: no personal data in the files, reproducible zip, VirusTotal check, Nexus Mods quarantine email"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]
keywords = ["modding", "nexus mods", "release", "metadata", "virustotal", "reproducible"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Games/Entertainment"]

[project.urls]
Homepage = "https://github.com/ayokiru/modrelease"

[project.scripts]
modrelease = "modrelease.cli:main"

[tool.setuptools]
packages = ["modrelease"]
